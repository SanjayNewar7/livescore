name: livescore
description: A professional football app for live scores, standings, and news
publish_to: 'none'
version: 1.0.0+5




environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.1.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Image Handling
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  permission_handler: ^11.0.0


  #sharing
  share_plus: ^7.2.1

  # Utilities
  intl: ^0.18.1
  connectivity_plus: ^6.1.5
  url_launcher: ^6.2.5
  flutter_html: ^3.0.0-beta.2

  # WebView for articles (optional but recommended)
  webview_flutter: ^4.4.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: SportFont
      fonts:
        - asset: assets/fonts/SportFont-Thin.ttf
          weight: 100
        - asset: assets/fonts/SportFont-Light.ttf
          weight: 300
        - asset: assets/fonts/SportFont-Regular.ttf
          weight: 400
        - asset: assets/fonts/SportFont-Medium.ttf
          weight: 500
        - asset: assets/fonts/SportFont-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SportFont-Bold.ttf
          weight: 700
        - asset: assets/fonts/SportFont-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/SportFont-Black.ttf
          weight: 900
